<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>showcase particle self test</title>
<link rel="icon" href="data:,">
<!--
  shared/ar-core/ の粒子・傾き・入力・音を XR8 抜きで動かす確認用ページ。
  ヘッドレス Chrome にはカメラが無く XR8.run() が走らないので、
  シェーダが通るか / 形状が正しいかはここで見る。

  ?sample= で対象を選ぶ（既定は showcase）。ページと同じく 'ar-config' / 'ar-targets' を
  importmap でそのサンプルのファイルに解決してから読む。

    node tools/headless-check.mjs "http://127.0.0.1:8811/tools/showcase-selftest.html?variant=normal" \
      --wait 9000 --eval "window.__selftest"
    node tools/headless-check.mjs "http://127.0.0.1:8811/tools/showcase-selftest.html?sample=sumi" \
      --wait 12000 --screenshot /tmp/sumi-selftest.png --eval "window.__selftest"
-->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script>
  // module より前に importmap を差す（module が読み込まれ始めた後では効かない）
  (function () {
    var DIRS = {showcase: '../showcase/', sumi: '../samples-ar/sumi/'}
    var sample = new URLSearchParams(location.search).get('sample') || 'showcase'
    var dir = DIRS[sample]
    if (!dir) { throw new Error('unknown sample: ' + sample) }
    window.__SAMPLE = {name: sample, dir: dir}
    var map = document.createElement('script')
    map.type = 'importmap'
    map.textContent = JSON.stringify({imports: {
      'three': '../lib/vendor/three/three.module.min.js',
      'ar-config': dir + 'ar/config.js',
      'ar-targets': dir + 'ar/targets.js',
    }})
    document.currentScript.after(map)
  })()
</script>
</head>
<body>
<script type="module">
import * as THREE_NS from 'three'
import {ParticleField, MODE} from '../shared/ar-core/particles.js'
import {AUDIO, CARD, PARTICLES, REFORM, SCATTER, TILT, WIND} from 'ar-config'
import {cardPoseFromDetail, dataUrls} from 'ar-targets'
import {Tilt} from '../shared/ar-core/tilt.js'
import {Wind} from '../shared/ar-core/wind.js'
import {Audio} from '../shared/ar-core/audio.js'

const THREE = THREE_NS
window.THREE = THREE

const SAMPLE = window.__SAMPLE.name
const COLS = 3
const ROWS = 3
const TILE = 520
// 再形成が終わりきった時刻
const SETTLED_T = REFORM.durationS + REFORM.delaySpanS + 0.4

// サンプルごとの違い（それ以外の確認は共通）
const SAMPLES = {
  showcase: {
    variant: new URLSearchParams(location.search).get('variant') || 'normal',
    // MIT エンジンが返した実際の detail（ヘッドレス Chrome + 偽カメラで取得。
    // 名刺を正面・面内 12° 回転で写したもの）。scale はカード長辺のワールド長。
    detail: {
      name: 'antymark-card-normal',
      position: {x: -0.000028, y: 1.998735, z: -0.967302},
      rotation: {x: 0.000603, y: 0.000443, z: -0.104514, w: -0.994523},
      scale: 0.6318985223770142,
      scaledWidth: 1.5444947209653093,
      scaledHeight: 1,
    },
    // エンジンの姿勢（90° 回った縦長画像の軸）で見たカード左上: (+27.5, +42.5)
    topLeftInEngine: [CARD.heightMm / 2, CARD.widthMm / 2],
    states: [
      {label: 'breathe (printed rest)', mode: MODE.BREATHE, t: 1.0},
      {label: 'tilt slide + pile', mode: MODE.BREATHE, t: 1.0, grav: [0.9, -0.42]},
      {label: 'scatter t=0.45s', mode: MODE.SCATTER, t: 0.45, wind: 0.9},
      {label: 'reform logotype', mode: MODE.REFORM, shape: 'logotype', t: 3.4, wind: 0.9},
      {label: 'reform fish', mode: MODE.REFORM, shape: 'fish', t: 3.4, wind: 0.9},
      {label: 'reform ant', mode: MODE.REFORM, shape: 'ant', t: 3.4, wind: 0.9},
    ],
    // 10° で平均 2mm 以上（カード幅 85mm に対し目で追える量）
    minSlide10Mm: 2,
  },
  sumi: {
    variant: 'sumi',
    // 偽カメラに target.png（縦長）を正面から写したときの実際の値。scaledWidth = 502 / 1024
    detail: {
      name: 'sample-sumi',
      position: {x: -0.001246, y: 2.000968, z: -0.726713},
      rotation: {x: -0.0000547, y: 0.000582, z: 0.706996, w: -0.707217},
      scale: 0.6318985223770142,
      scaledWidth: 0.490234375,
      scaledHeight: 1,
    },
    // 縦長画像は回されないので roll 0。左上は (-260, +530) のまま
    topLeftInEngine: [-CARD.widthMm / 2, CARD.heightMm / 2],
    // 6 状態。煙の 2 枚は紙を壁に掛けた姿勢（実際の下 = 紙の -y）
    states: [
      {label: 'breathe (printed rest)', mode: MODE.BREATHE, t: 1.0},
      {label: 'tilt slide + pile', mode: MODE.BREATHE, t: 1.0, grav: [0.9, -0.42]},
      {label: 'scatter t=0.45s (smoke)', mode: MODE.SCATTER, t: 0.45, wind: 0.85},
      {label: 'scatter t=1.5s (rising)', mode: MODE.SCATTER, t: 1.5, wind: 0.85},
      {label: 'reform enso', mode: MODE.REFORM, shape: 'enso', t: SETTLED_T, wind: 0.85},
      {label: 'reform sumi', mode: MODE.REFORM, shape: 'sumi', t: SETTLED_T, wind: 0.85},
    ],
    // showcase の 2mm を、滑り量 0.5 倍・紙の大きさ（unitMm）で換算
    minSlide10Mm: 2 * 0.5 * PARTICLES.unitMm,
  },
}
const S = SAMPLES[SAMPLE]
const VARIANT = S.variant
const REAL_DETAIL = S.detail
const report = {sample: SAMPLE, variant: VARIANT, ok: false, tiles: [], checks: {}}

const near = (a, b, eps) => Math.abs(a - b) <= eps

// imagefound の detail -> root(姿勢・倍率) -> card(roll) を main.js と同じ組み方で作る
const placeCard = (THREE, root, card, detail) => {
  const pose = cardPoseFromDetail(detail)
  root.position.copy(detail.position)
  root.quaternion.copy(detail.rotation)
  root.scale.setScalar(pose.mmToWorld)
  card.rotation.z = pose.roll
  root.updateMatrixWorld(true)
  return pose
}

// (1) 板と点群が 85x55mm でターゲットに重なるか
const checkPose = (THREE) => {
  const root = new THREE.Group()
  const card = new THREE.Group()
  root.add(card)
  const pose = placeCard(THREE, root, card, REAL_DETAIL)
  const hw = CARD.widthMm / 2
  const hh = CARD.heightMm / 2
  const toRoot = (x, y) => {
    // カード mm -> root ローカル（エンジンの縦長画像の軸、単位はまだ mm）
    const v = new THREE.Vector3(x, y, 0).applyEuler(card.rotation)
    return [v.x, v.y]
  }
  const w = (x, y) => new THREE.Vector3(x, y, 0).applyMatrix4(card.matrixWorld)
  const tl = w(-hw, hh)
  const tr = w(hw, hh)
  const bl = w(-hw, -hh)
  const longWorld = Math.max(tl.distanceTo(tr), tl.distanceTo(bl))
  const shortWorld = Math.min(tl.distanceTo(tr), tl.distanceTo(bl))
  const tlRoot = toRoot(-hw, hh)
  const c = {
    mmToWorld: pose.mmToWorld,
    rollDeg: pose.roll * 180 / Math.PI,
    aspectRatio: pose.aspectRatio,
    longWorld,
    shortWorld,
    // 長辺が detail.scale に、短辺がその 短辺/長辺 に一致すること
    longIsScale: near(longWorld, REAL_DETAIL.scale, 1e-6),
    shortIsScaled: near(shortWorld, REAL_DETAIL.scale *
      Math.min(CARD.widthMm, CARD.heightMm) / Math.max(CARD.widthMm, CARD.heightMm), 1e-6),
    // エンジンの姿勢では長辺がローカル Y。カード左上は S.topLeftInEngine に来る
    topLeftInEngineAxes: tlRoot.map(v => Math.round(v * 100) / 100),
    longAlongEngineY: near(tlRoot[0], S.topLeftInEngine[0], 1e-4) &&
      near(tlRoot[1], S.topLeftInEngine[1], 1e-4) && Math.abs(tlRoot[1]) >= Math.abs(tlRoot[0]),
    aspectOk: near(pose.aspectRatio, 1, 0.01),
  }
  c.ok = c.longIsScale && c.shortIsScaled && c.longAlongEngineY && c.aspectOk
  return c
}

// (2) 傾きが「認識時の姿勢からの相対角」になっているか
const checkTilt = (THREE) => {
  const camera = new THREE.Object3D()       // XR8 のカメラ相当（ワールド原点・正面）
  const root = new THREE.Group()
  const card = new THREE.Group()
  root.add(card)
  const tilt = new Tilt(THREE)
  const out = {}

  // 机のカードを斜め 35° から覗いて認識した、という姿勢
  const foundQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(-35 * Math.PI / 180, 0.3, 0.2))
  const at = (q) => {
    root.quaternion.copy(q)
    card.rotation.z = -Math.PI / 2
    root.updateMatrixWorld(true)
    camera.updateMatrixWorld(true)
    tilt.update(camera, card)
    return {deg: +tilt.degrees.toFixed(3), gx: +tilt.downCard.x.toFixed(4), gy: +tilt.downCard.y.toFixed(4)}
  }
  // 「下」に直交するワールド軸回りに回す = その角度だけ傾ける。
  // which=0 は下とカード法線の両方に直交する軸（手前・奥）、1 はそれと下に直交する軸（左右）
  const tiltedBy = (deg, which) => {
    const down = new THREE.Vector3(0, -1, 0)
    const n = new THREE.Vector3(0, 0, 1).applyQuaternion(foundQ)
    const a0 = down.clone().cross(n).normalize()
    const ax = which === 0 ? a0 : down.clone().cross(a0).normalize()
    return new THREE.Quaternion().setFromAxisAngle(ax, deg * Math.PI / 180).multiply(foundQ)
  }

  tilt.resetBase()
  out.atFound = at(foundQ)
  out.foundIsLevel = out.atFound.deg < 1e-3 && out.atFound.gx === 0 && out.atFound.gy === 0
  // 旧実装（基準なしの絶対角）なら、認識した瞬間にこの角度だけ傾いていると判定されていた
  out.absoluteDegAtFound = +(Math.asin(Math.min(1, Math.hypot(tilt.downLocal.x, tilt.downLocal.y))) * 180 / Math.PI).toFixed(2)

  out.jitter3deg = at(tiltedBy(3, 0))
  out.jitterIgnored = out.jitter3deg.gx === 0 && out.jitter3deg.gy === 0

  out.tilt25 = at(tiltedBy(25, 0))
  out.tilt25Ok = near(out.tilt25.deg, 25, 0.05) &&
    near(Math.hypot(out.tilt25.gx, out.tilt25.gy), Math.sin((25 - TILT.deadzoneDeg) * Math.PI / 180), 1e-3) &&
    out.tilt25.deg < TILT.spillDeg

  // 10° 程度でも滑りが見えること（量は描画して main() で測る）
  out.tilt10 = at(tiltedBy(10, 1))

  out.tilt50 = at(tiltedBy(50, 1))
  out.tilt50Spills = out.tilt50.deg > TILT.spillDeg

  // 傾けたまま見失って再認識 -> そこが新しい基準
  tilt.resetBase()
  out.refound = at(tiltedBy(50, 1))
  out.refoundIsLevel = out.refound.deg < 1e-3 && out.refound.gx === 0 && out.refound.gy === 0
  // 再認識後に元の姿勢へ戻すと、今度はそちらが 50° の傾きになる
  out.backToOld = at(foundQ)
  out.backToOldOk = near(out.backToOld.deg, 50, 0.05)

  // DeviceMotion の許可が下りて「下」の情報源が変わったら取り直す
  tilt.resetBase()
  at(foundQ)
  tilt._downDevice.set(0.3, -0.9, -0.3).normalize()
  tilt.hasMotion = true
  out.sourceSwitch = at(foundQ)
  out.sourceSwitchRebased = out.sourceSwitch.deg < 1e-3

  out.ok = out.foundIsLevel && out.jitterIgnored && out.tilt25Ok && out.tilt50Spills &&
    out.refoundIsLevel && out.backToOldOk && out.sourceSwitchRebased
  return {out, grav: [out.tilt25.gx, out.tilt25.gy], grav10: [out.tilt10.gx, out.tilt10.gy]}
}

// (3) 入力: 名刺上のタップと、マイク経路の判定（AnalyserNode はスタブ）
const sleep = ms => new Promise(r => setTimeout(r, ms))
const checkWind = async () => {
  const out = {tapMaxMovePx: WIND.tapMaxMovePx, tapMaxS: WIND.tapMaxS, tapStrength: WIND.tapStrength,
    medianWindowS: WIND.medianWindowS, medianX: WIND.medianX, minRms: WIND.minRms,
    holdS: WIND.holdS, cooldownS: WIND.cooldownS}
  // 指定どおりの値で、旧判定（ノイズフロア・立ち上がり・帯域比・長押し）の設定が残っていないこと
  out.settingsOk = WIND.tapMaxMovePx === 10 && WIND.tapMaxS === 0.3 &&
    WIND.medianWindowS === 2.0 && WIND.medianX === 3 && WIND.minRms === 0.008 &&
    WIND.holdS === 0.08 && WIND.cooldownS === 2.0 &&
    ['calibS', 'floorTauS', 'floorX', 'freezeMaxS', 'riseWindowS', 'riseX', 'lowBandHz',
      'lowBandRatio', 'longPressS'].every(k => !(k in WIND))
  const fakeAudio = {ctx: {sampleRate: 48000}, ensureCtx() { return this.ctx }}

  // タップ: PointerEvent を合成して attachTap に流す。onCard は「左半分が名刺」とする
  const log = []
  const wind = new Wind(fakeAudio, s => log.push(['wind', s, wind.lastEvent.source]), () => log.push(['calm']))
  const el = document.createElement('div')
  document.body.appendChild(el)
  wind.attachTap(el, x => x < 200)
  const ev = (type, x, y, id = 1) =>
    el.dispatchEvent(new PointerEvent(type, {bubbles: true, pointerId: id, clientX: x, clientY: y}))
  const tapGesture = async (x, y, ms, dx = 0, dy = 0) => {
    const n = log.length
    ev('pointerdown', x, y); await sleep(ms); ev('pointerup', x + dx, y + dy)
    await sleep(20)
    return log.slice(n)
  }
  // 短いタップ（50ms・移動 0）で 散る（0.85）-> すぐ止む（再形成へ）
  const t1 = await tapGesture(100, 100, 50)
  out.tapFires = t1.length === 2 && t1[0][0] === 'wind' && t1[0][1] === WIND.tapStrength &&
    t1[0][2] === 'tap' && t1[1][0] === 'calm' && wind.lastTap.fired
  // 9px 動いても 10px 未満ならタップ
  out.tapSmallMoveFires = (await tapGesture(100, 100, 50, 6, 6.7)).length === 2
  // 10px 以上動いたら（ドラッグ）発火しない
  out.tapDragIgnored = (await tapGesture(100, 100, 50, 10, 0)).length === 0 &&
    wind.lastTap.movePx >= 10 && !wind.lastTap.fired
  // 300ms 以上押していたら発火しない（長押しフォールバックは廃止。長押しでも何も起きない）
  out.tapLongIgnored = (await tapGesture(100, 100, 400)).length === 0 && wind.lastTap.ms >= 300
  // 名刺の外では発火しない
  out.tapOffCardIgnored = (await tapGesture(300, 100, 50)).length === 0 && !wind.lastTap.onCard
  // 2 本目の指が来たらタップではない
  {
    const n = log.length
    ev('pointerdown', 100, 100, 1); ev('pointerdown', 150, 100, 2)
    await sleep(50)
    ev('pointerup', 150, 100, 2); ev('pointerup', 100, 100, 1)
    await sleep(20)
    out.tapMultiTouchIgnored = log.length === n
  }
  // pointercancel（スクロール等で奪われた）では発火しない
  {
    const n = log.length
    ev('pointerdown', 100, 100); await sleep(50); ev('pointercancel', 100, 100); ev('pointerup', 100, 100)
    await sleep(20)
    out.tapCancelIgnored = log.length === n
  }
  // 長押し用の API は無い
  out.noLongPress = typeof wind.attachLongPress === 'undefined'
  el.remove()

  // マイク経路: 指定の RMS を返すスタブ Analyser で update() を 50fps で回す。
  // rms は数値か、時刻 -> 値の関数。taps は Wind.tap(t) を呼ぶ時刻
  const micRun = (rms, seconds, taps = []) => {
    const at = (v, t) => (typeof v === 'function' ? v(t) : v)
    const events = []
    const w = new Wind(fakeAudio, s => events.push(['wind', +s.toFixed(3), +now.toFixed(2), w.lastEvent.source]),
      () => events.push(['calm', +now.toFixed(2)]))
    w.granted = true
    w._td = new Float32Array(1024)
    let now = 0
    let maxRatio = 0
    w.analyser = {getFloatTimeDomainData: a => a.fill(at(rms, now))}
    const pending = taps.slice()
    for (let k = 0; k * 0.02 <= seconds + 1e-9; k++) {
      now = k * 0.02
      while (pending.length && pending[0] <= now + 1e-9) { w.tap(pending.shift()) }
      w.update(now)
      maxRatio = Math.max(maxRatio, w.ratio)
    }
    return {events, rms: +w.rms.toFixed(4), median: +w.median.toFixed(4),
      threshold: +w.threshold.toFixed(4), maxRatio: +maxRatio.toFixed(2), blowing: w.blowing}
  }
  const mics = r => r.events.filter(e => e[0] === 'wind' && e[3] === 'mic')
  // 環境音 AMB の中で T0（中央値の窓が埋まった後）から息を吹く
  const AMB = 0.01
  const T0 = WIND.medianWindowS + 0.5
  const TH = AMB * WIND.medianX
  const breath = (level, end = Infinity) => t => (t >= T0 && t < end ? level : AMB)
  // 一定の環境音では発火しない: 許可直後から 0.03±20% が 5 秒（履歴が空の最初の数フレームも含む）
  out.ambientConstant = micRun(t => 0.03 * (1 + 0.2 * Math.sin(t * 37)), 5)
  out.ambientConstantIgnored = out.ambientConstant.events.length === 0
  // 中央値の 3 倍を越える息で holdS 後に発火する
  out.micBreath = micRun(breath(TH * 1.2, T0 + 0.3), T0 + 0.6)
  const mb = mics(out.micBreath)
  out.micBreathFires = mb.length === 1 && mb[0][2] - T0 >= WIND.holdS - 1e-9 &&
    mb[0][2] - T0 < WIND.holdS + 0.03 && near(out.micBreath.median, AMB, 1e-6) &&
    out.micBreath.events.some(e => e[0] === 'calm' && e[1] >= T0 + 0.3 - 1e-9)
  // 3 倍未満では発火しない
  out.micBelowX = micRun(breath(TH * 0.8), T0 + 0.6)
  out.micBelowXIgnored = out.micBelowX.events.length === 0
  // holdS に満たない短い音（80ms 未満）では発火しない
  out.micTooShort = micRun(breath(TH * 3, T0 + WIND.holdS - 0.02), T0 + 0.6)
  out.micTooShortIgnored = out.micTooShort.events.length === 0
  // 下限: 無音に近い部屋では minRms が効く（0.8 倍は発火しない、1.5 倍は発火する）
  out.micQuietRoom = micRun(t => (t >= T0 ? WIND.minRms * 0.8 : 0.0005), T0 + 0.6)
  out.micQuietRoomIgnored = out.micQuietRoom.events.length === 0
  out.micQuietRoomLoud = micRun(t => (t >= T0 ? WIND.minRms * 1.5 : 0.0005), T0 + 0.6)
  out.micQuietRoomLoudFires = mics(out.micQuietRoomLoud).length === 1
  // 急に始まって鳴り続ける音: 1 回は発火する（許容する誤発火）。中央値が追いつくと止み、
  // 鳴り続けても 2 回目は来ない
  out.ambientStep = micRun(t => (t >= T0 ? AMB * 6 : AMB), T0 + 8)
  const calm = out.ambientStep.events.find(e => e[0] === 'calm')
  out.ambientStepOnce = mics(out.ambientStep).length === 1 && !!calm &&
    calm[1] < T0 + WIND.medianWindowS / 2 + 0.2 && !out.ambientStep.blowing
  // 強さ: 閾値すれすれ -> 0.3 付近、閾値の strengthFullX 倍以上 -> 1.0。0.3..1.0 の外に出ない
  out.strengthJustOver = +Wind.strengthOf(TH * 1.01, TH).toFixed(3)
  out.strengthMid = +Wind.strengthOf(TH * 3, TH).toFixed(3)
  out.strengthHuge = +Wind.strengthOf(1.0, TH).toFixed(3)
  out.micLoud = micRun(breath(TH * 20, T0 + 0.2), T0 + 0.6)
  out.strengthOk = near(out.strengthJustOver, 0.3, 0.01) && out.strengthMid > 0.3 &&
    out.strengthMid < 1 && out.strengthHuge === 1 &&
    near(mb[0][1], Wind.strengthOf(TH * 1.2, TH), 2e-3) && mics(out.micLoud)[0][1] === 1
  // クールダウン 2.0s: 0.15s の息を 0.6s おきに。2 回目は発火から 2.0s 経った後の最初の息
  const burst = t => (t >= T0 && (t - T0) % 0.6 < 0.15 ? TH * 1.5 : AMB)
  out.micCooldown = micRun(burst, T0 + 2.7)
  const fires = mics(out.micCooldown)
  out.cooldownOk = fires.length === 2 && fires[1][2] - fires[0][2] >= WIND.cooldownS - 1e-9 &&
    near(fires[1][2], T0 + 2.4 + WIND.holdS, 0.03)
  // タップもクールダウンを始める（画面を叩いた音でマイクが二重に発火しない）。タップ自体は
  // クールダウンに関係なく毎回発火する
  out.tapThenMic = micRun(t => (t >= T0 && t < T0 + 0.15) || (t >= T0 + 1.6 && t < T0 + 1.75)
    ? TH * 1.5 : AMB, T0 + 2, [T0 - 0.5, T0 - 0.3])
  const tm = out.tapThenMic.events.filter(e => e[0] === 'wind')
  out.tapSharesCooldown = tm.length === 3 && tm[0][3] === 'tap' && tm[1][3] === 'tap' &&
    tm[2][3] === 'mic' && near(tm[2][2], T0 + 1.6 + WIND.holdS, 0.03)

  out.ok = out.settingsOk && out.tapFires && out.tapSmallMoveFires && out.tapDragIgnored &&
    out.tapLongIgnored && out.tapOffCardIgnored && out.tapMultiTouchIgnored && out.tapCancelIgnored &&
    out.noLongPress && out.ambientConstantIgnored && out.micBreathFires && out.micBelowXIgnored &&
    out.micTooShortIgnored && out.micQuietRoomIgnored && out.micQuietRoomLoudFires &&
    out.ambientStepOnce && out.strengthOk && out.cooldownOk && out.tapSharesCooldown
  return out
}

// (3b) 見失い -> 再認識: main.js の pause / resume が使う ParticleField と Audio の部品
const checkResume = async (field) => {
  const u = field.uniforms
  const out = {}
  const src = () => (field.srcIsA ? field.aA : field.aB).array
  const dst = () => (field.srcIsA ? field.aB : field.aA).array
  // 散って 0.3s で見失い、5s 後に再認識
  field.startScatter(0.9, 1.0)
  const lostAt = 1.3
  const foundAt = 6.3
  field.shiftClock(foundAt - lostAt)
  out.scatterElapsedKept = +(foundAt - u.uScatterT0.value).toFixed(6)
  field.reformToCurrent(foundAt)
  out.reformsToCurrent = u.uMode.value === MODE.REFORM && u.uT0.value === foundAt &&
    dst().every((v, i) => v === src()[i])
  out.scatterKeptOk = near(out.scatterElapsedKept, lostAt - 1.0, 1e-6)
  // settle 後の形は見失う前と同じ（循環は進まない）
  const before = src().slice()
  const cycle = field.cycleIndex
  field.settle()
  out.shapeUnchanged = src().every((v, i) => v === before[i]) && field.cycleIndex === cycle &&
    u.uMode.value === MODE.BREATHE

  // 鳴っている途中の音を stopAll で即止める
  const sr = 48000
  const a = new Audio()
  a.ctx = new OfflineAudioContext(1, sr, sr)
  a.wire()
  a.scatterAt(0, 1.0)
  out.playingBeforeStop = a.playing.size
  a.stopAll()
  const d = (await a.ctx.startRendering()).getChannelData(0)
  out.peakAfterStop = +Math.max(...d.map(Math.abs)).toFixed(5)
  out.audioStops = out.playingBeforeStop >= 1 && a.playing.size === 0 && out.peakAfterStop < 1e-3

  out.ok = out.reformsToCurrent && out.scatterKeptOk && out.shapeUnchanged && out.audioStops
  u.uMode.value = MODE.BREATHE
  return out
}

// (4) 散る音: OfflineAudioContext で実際に鳴らし、立ち上がりとピークを測る
const checkAudio = () => (AUDIO.scatterVoice === 'bell' ? checkBell() : checkGrain())

// Goertzel: 周波数 f の成分の大きさ（d[i0..i1)）
const goertzel = (d, sr, f, i0, i1) => {
  const w = 2 * Math.PI * f / sr
  const c = 2 * Math.cos(w)
  let s1 = 0
  let s2 = 0
  for (let i = i0; i < i1; i++) {
    const s0 = d[i] + c * s1 - s2
    s2 = s1
    s1 = s0
  }
  return Math.sqrt(s1 * s1 + s2 * s2 - c * s1 * s2) / (i1 - i0)
}
const rmsOf = (d, i0, i1) => {
  let e = 0
  for (let i = i0; i < i1; i++) { e += d[i] * d[i] }
  return Math.sqrt(e / (i1 - i0))
}

// 'bell'（墨）: 鐘 110Hz ＋倍音 3 つ、4 秒で減衰。散っている間の擦れは 1〜3kHz の帯域ノイズ
const checkBell = async () => {
  const sr = 48000
  const render = async (fn, seconds) => {
    const a = new Audio()
    a.ctx = new OfflineAudioContext(1, Math.ceil(sr * seconds), sr)
    a.wire()
    fn(a)
    const buf = await a.ctx.startRendering()
    return {d: buf.getChannelData(0), comp: a.comp}
  }
  const both = await render(a => a.scatterAt(0, 1.0), 4.6)
  const four = await render(a => [1, 1, 1, 1].forEach(() => a.scatterAt(0, 1.0)), 1.0)
  const bell = (await render(a => a.bellAt(0, 1.0), 4.6)).d
  const brush = (await render(a => a.brushAt(0, 1.0), 3.0)).d
  const at = s => Math.round(s * sr)
  const peakOf = d => d.reduce((m, v) => Math.max(m, Math.abs(v)), 0)
  const out = {bellHz: AUDIO.bellHz, partials: AUDIO.bellPartials.map(p => p[0]),
    compressor: both.comp instanceof DynamicsCompressorNode}
  out.settingsOk = AUDIO.bellHz === 110 && AUDIO.bellPartials.length === 4 &&
    AUDIO.bellPartials[0][0] === 1 && AUDIO.bellPartials[0][2] === 4.0 &&
    AUDIO.brushBandHz[0] === 1000 && AUDIO.brushBandHz[1] === 3000 && AUDIO.gather === false
  // 基音: 0.5〜1.5s で 110Hz が周りの周波数より十分大きい
  const g = f => goertzel(bell, sr, f, at(0.5), at(1.5))
  out.g110 = +g(110).toExponential(2)
  out.g80 = +g(80).toExponential(2)
  out.g150 = +g(150).toExponential(2)
  out.fundamentalOk = out.g110 > 20 * out.g80 && out.g110 > 20 * out.g150
  // 倍音 3 つがそれぞれ鳴っている（隣の周波数より大きい）
  out.overtonesOk = AUDIO.bellPartials.slice(1).every(([r]) => {
    const f = AUDIO.bellHz * r
    const gp = goertzel(bell, sr, f, at(0.05), at(0.45))
    return gp > 5 * goertzel(bell, sr, f * 1.13, at(0.05), at(0.45))
  })
  // 減衰 4 秒: 3.9〜4.0s の RMS は鳴り始め（0.05〜0.15s）の 2% 未満、1s ではまだ 20% 以上
  const r0 = rmsOf(bell, at(0.05), at(0.15))
  out.decay1sRatio = +(rmsOf(bell, at(0.95), at(1.05)) / r0).toFixed(3)
  out.decay4sRatio = +(rmsOf(bell, at(3.9), at(4.0)) / r0).toFixed(4)
  out.decayOk = out.decay1sRatio > 0.2 && out.decay4sRatio < 0.02
  // 擦れ: 1〜3kHz に収まり、薄い（鐘のピークより十分小さい）
  const gb = f => goertzel(brush, sr, f, at(0.5), at(1.2))
  out.brush2k = +gb(2000).toExponential(2)
  out.brush300 = +gb(300).toExponential(2)
  out.brush7k = +gb(7000).toExponential(2)
  out.brushBandOk = out.brush2k > 5 * out.brush300 && out.brush2k > 5 * out.brush7k
  out.brushPeak = +peakOf(brush).toFixed(4)
  out.bellPeak = +peakOf(bell).toFixed(4)
  out.brushThin = out.brushPeak < out.bellPeak * 0.5
  // 破裂音にならない（頭 5ms はピークの 2 割未満）、4 つ重ねてもクリップしない
  const env = (d, i0) => rmsOf(d, i0, i0 + at(0.002))
  let envPeak = 0
  for (let i = 0; i + at(0.002) < at(0.3); i += at(0.002)) { envPeak = Math.max(envPeak, env(both.d, i)) }
  out.first5msOfPeak = +(Math.max(env(both.d, 0), env(both.d, at(0.002))) / envPeak).toFixed(3)
  out.softOnset = out.first5msOfPeak < 0.2
  out.peak = +peakOf(both.d).toFixed(4)
  out.stacked4Peak = +peakOf(four.d).toFixed(4)
  out.noClip = out.peak < 1 && out.stacked4Peak < 1
  out.ok = out.compressor && out.settingsOk && out.fundamentalOk && out.overtonesOk && out.decayOk &&
    out.brushBandOk && out.brushThin && out.softOnset && out.noClip
  return out
}

// 'grain'（showcase）
const checkGrain = async () => {
  const sr = 48000
  const render = async (strengths) => {
    const a = new Audio()
    a.ctx = new OfflineAudioContext(1, Math.ceil(sr * 1.2), sr)
    a.wire()
    strengths.forEach(s => a.grainAt(0, s))   // 複数同時 = 最悪の重なり
    const buf = await a.ctx.startRendering()
    return {d: buf.getChannelData(0), comp: a.comp}
  }
  const stats = (d) => {
    let peak = 0
    let jump = 0
    for (let i = 0; i < d.length; i++) {
      peak = Math.max(peak, Math.abs(d[i]))
      if (i) { jump = Math.max(jump, Math.abs(d[i] - d[i - 1])) }
    }
    // 2ms 窓の RMS エンベロープ
    const win = Math.round(sr * 0.002)
    const env = []
    for (let i = 0; i + win <= d.length; i += win) {
      let e = 0
      for (let j = i; j < i + win; j++) { e += d[j] * d[j] }
      env.push(Math.sqrt(e / win))
    }
    const envPeak = Math.max(...env)
    const envPeakMs = env.indexOf(envPeak) * 2
    const first5ms = Math.max(...env.slice(0, 3))
    return {peak: +peak.toFixed(4), maxStep: +jump.toFixed(4), envPeakMs,
      first5msOfPeak: +(first5ms / envPeak).toFixed(3)}
  }
  const one = await render([1.0])
  const four = await render([1.0, 1.0, 1.0, 1.0])
  const out = {scatterGain: AUDIO.scatterGain, attackS: AUDIO.scatterAttackS,
    compressor: one.comp instanceof DynamicsCompressorNode,
    single: stats(one.d), stacked4: stats(four.d)}
  // 60% 音量: 旧 0.35 の 0.6 倍
  out.gainIs60pct = near(AUDIO.scatterGain, 0.35 * 0.6, 1e-9)
  // 破裂音にならない: 頭 5ms はピークの 2 割未満、最大エンベロープはランプの後、クリップしない
  out.softOnset = out.single.first5msOfPeak < 0.2 && out.single.envPeakMs >= 30 &&
    out.stacked4.first5msOfPeak < 0.2
  out.noClip = out.single.peak < 1 && out.stacked4.peak < 1
  out.ok = out.compressor && out.gainIs60pct && out.softOnset && out.noClip
  return out
}

// 明るさの重心（px）。タイル内のピクセル列から
const centroid = (buf, w) => {
  let sx = 0
  let sy = 0
  let sw = 0
  for (let i = 0; i < buf.length; i += 4) {
    const v = buf[i] + buf[i + 1] + buf[i + 2]
    if (!v) { continue }
    const p = i / 4
    sx += (p % w) * v
    sy += Math.floor(p / w) * v
    sw += v
  }
  return [sx / sw, sy / sw]
}

window.__selftest = report

const main = async () => {
  // dataUrls はページからの相対 URL なので、サンプルのディレクトリを基準に解決する
  const base = new URL(window.__SAMPLE.dir, location.href)
  const urls = dataUrls(VARIANT)
  const [particles, shapes] = await Promise.all([
    fetch(new URL(urls.particles, base)).then(r => r.json()),
    fetch(new URL(urls.shapes, base)).then(r => r.json()),
  ])
  report.count = particles.count
  report.shapes = Object.keys(shapes.shapes)

  const canvas = document.createElement('canvas')
  canvas.width = COLS * TILE
  canvas.height = ROWS * TILE
  document.body.appendChild(canvas)

  const renderer = new THREE.WebGLRenderer({canvas, antialias: false})
  renderer.setClearColor(0x000000, 1)
  renderer.setScissorTest(true)

  const field = new ParticleField(THREE, particles, shapes)
  const scene = new THREE.Scene()
  const root = new THREE.Group()
  const plane = field.makeCardPlane()
  root.add(plane)
  root.add(field.points)
  scene.add(root)

  // カード全体が入るように正面から見る
  // 名刺（長辺 85mm）で 130mm。大きな紙はその比で引く
  const K = Math.max(CARD.widthMm, CARD.heightMm) / 85
  const camera = new THREE.PerspectiveCamera(40, 1, K, 2000 * K)
  camera.position.set(0, 0, 130 * K)
  camera.lookAt(0, 0, 0)

  report.checks.pose = checkPose(THREE)
  const tiltCheck = checkTilt(THREE)
  report.checks.tilt = tiltCheck.out
  report.checks.wind = await checkWind()
  report.checks.audio = await checkAudio()
  report.checks.resume = await checkResume(field)

  const setup = [
    ...S.states,
    // 斜め 35° で認識した直後の BREATHE。tilt.js の出力をそのまま重力に入れる -> 印刷位置のまま
    {label: 'found at 35deg (relative tilt 0)', mode: MODE.BREATHE, t: 1.0, grav: [0, 0], read: true},
    {label: 'relative tilt 25deg', mode: MODE.BREATHE, t: 1.0, grav: tiltCheck.grav, read: true},
    // 板は動かないので重心を薄める。点だけ描いて測る
    {label: 'relative tilt 10deg (points only)', mode: MODE.BREATHE, t: 1.0, grav: tiltCheck.grav10,
      read: true, noPlane: true},
  ]
  const pixels = {}

  // 煙（fallMm < 0）: 紙を壁に掛けた姿勢（実際の下 = 紙の -y）で散らすと、点群の重心が上へ動くこと。
  // タイル 0 の場所で点だけ描いて測る（タイル 0 は後で描き直す）
  if (SCATTER.fallMm < 0) {
    const u = field.uniforms
    const mmPerPx0 = 2 * camera.position.z * Math.tan(camera.fov / 2 * Math.PI / 180) / TILE
    renderer.setViewport(0, canvas.height - TILE, TILE, TILE)
    renderer.setScissor(0, canvas.height - TILE, TILE, TILE)
    plane.visible = false
    const shot = (mode, t) => {
      u.uMode.value = mode
      u.uT0.value = 0
      u.uScatterT0.value = 0
      u.uWind.value = 0.85
      u.uGrav.value.set(0, 0)
      u.uDown.value.set(0, -1, 0)
      field.update(t, TILE, 1.0)
      renderer.render(scene, camera)
      const buf = new Uint8Array(TILE * TILE * 4)
      renderer.getContext().readPixels(0, canvas.height - TILE, TILE, TILE, 0x1908, 0x1401, buf)
      return centroid(buf, TILE)
    }
    const rest = shot(MODE.BREATHE, 1.0)
    const early = shot(MODE.SCATTER, 0.45)
    const late = shot(MODE.SCATTER, 1.5)
    // readPixels の行は下から上。行が増える = 上
    const upMm = c => +((c[1] - rest[1]) * mmPerPx0).toFixed(1)
    report.checks.smoke = {riseAt045sMm: upMm(early), riseAt15sMm: upMm(late),
      sideAt15sMm: +((late[0] - rest[0]) * mmPerPx0).toFixed(1)}
    // 1.5s で紙の高さの 15% 以上昇り、0.45s より上にいる（昇り続けている）
    report.checks.smoke.ok = report.checks.smoke.riseAt15sMm > 0.15 * CARD.heightMm &&
      report.checks.smoke.riseAt15sMm > report.checks.smoke.riseAt045sMm
    plane.visible = true
  }

  setup.forEach((s, i) => {
    const u = field.uniforms
    u.uWind.value = s.wind || 0
    u.uGrav.value.set(...(s.grav || [0, 0]))
    u.uSpillT0.value = -1
    u.uRespawnT0.value = -1
    if (s.shape) {
      field.setShape(s.shape, 0)     // uMode=REFORM, uT0=0
      u.uScatterT0.value = 0
    } else {
      u.uMode.value = s.mode
      u.uT0.value = 0
      u.uScatterT0.value = 0
    }
    field.update(s.t, TILE, 1.0)
    plane.visible = !s.noPlane

    const cx = (i % COLS) * TILE
    const cy = canvas.height - (Math.floor(i / COLS) + 1) * TILE
    renderer.setViewport(cx, cy, TILE, TILE)
    renderer.setScissor(cx, cy, TILE, TILE)
    const read = () => {
      const buf = new Uint8Array(TILE * TILE * 4)
      renderer.getContext().readPixels(cx, cy, TILE, TILE, 0x1908, 0x1401, buf)
      return buf
    }
    if (s.read) {
      // 同じビューポートで、重力 0（印刷どおりの静止）を先に描いて比較の基準にする
      const g = u.uGrav.value.clone()
      u.uGrav.value.set(0, 0)
      renderer.render(scene, camera)
      pixels[`${i}rest`] = read()
      u.uGrav.value.copy(g)
    }
    renderer.render(scene, camera)
    report.tiles.push(s.label)
    if (s.read) { pixels[i] = read() }
  })

  // 斜めで認識した直後（タイル 6）は印刷どおりの静止と同一の画、相対 25° のタイル 7 は違う画であること
  const diff = (a, b) => {
    let n = 0
    for (let k = 0; k < a.length; k++) { if (a[k] !== b[k]) { n++ } }
    return n
  }
  report.checks.restPixelsDiff = diff(pixels['6rest'], pixels[6])
  report.checks.tiltPixelsDiff = diff(pixels['7rest'], pixels[7])
  report.checks.breatheStaysPrinted = report.checks.restPixelsDiff === 0 &&
    report.checks.tiltPixelsDiff > 0

  // 10° の傾きで点群がどれだけ寄ったか（明るさ重心の移動、mm 換算）
  const mmPerPx = 2 * camera.position.z * Math.tan(camera.fov / 2 * Math.PI / 180) / TILE
  const shiftMm = (i) => {
    const a = centroid(pixels[`${i}rest`], TILE)
    const b = centroid(pixels[i], TILE)
    return +(Math.hypot(b[0] - a[0], b[1] - a[1]) * mmPerPx).toFixed(2)
  }
  report.checks.slide = {
    tilt10Grav: tiltCheck.grav10, tilt10ShiftMm: shiftMm(8),
  }
  report.checks.slide.minMm = +S.minSlide10Mm.toFixed(2)
  report.checks.slide.ok = report.checks.slide.tilt10ShiftMm >= S.minSlide10Mm

  const gl = renderer.getContext()
  report.glError = gl.getError()
  report.programs = renderer.info.programs.length
  report.shaderLog = renderer.info.programs
    .map(p => `${p.diagnostics ? 'DIAGNOSTICS ' + JSON.stringify(p.diagnostics) : 'ok'}`)
  report.drawCalls = renderer.info.render.calls
  report.pointsDrawn = field.drawCount
  report.cardMm = [CARD.widthMm, CARD.heightMm]
  report.ok = report.glError === 0 && report.drawCalls > 0 &&
    report.checks.pose.ok && report.checks.tilt.ok && report.checks.wind.ok &&
    report.checks.audio.ok && report.checks.resume.ok && report.checks.slide.ok && report.checks.breatheStaysPrinted &&
    (!report.checks.smoke || report.checks.smoke.ok)
}

main().then(() => { window.__selftestDone = true })
  .catch((e) => { report.error = String(e && e.stack || e); window.__selftestDone = true })
</script>
</body>
</html>
