<!doctype html>
<html>
  <head>
  <script>window.__XR_ENGINE_LICENSE = 'mit'</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>8th Wall Web: three.js image targets</title>
    <link rel="stylesheet" type="text/css" href="index.css">

    <!-- Three.js 160+ requires the use of import maps to use the Three.js renderer in projects -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.172.0/build/three.module.min.js",
          "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

      window.THREE = { ...THREE };
      window.THREE.GLTFLoader = GLTFLoader;
    </script>

    <!-- XR Extras - provides utilities like load screen, almost there, and error handling.
         See github.com/8thwall/web/tree/master/xrextras -->
    <script src="../../../lib/vendor/web/xrextras/xrextras.js"></script>
    <script src="../../../lib/vendor/qrcode-generator/qrcode.js"></script>
    <script src="../../../shared/landing.js"></script>

    <!-- MIT engine (engine/mit/, self-built from github.com/8thwall/8thwall) -->
    <script async src="../../../engine/mit/xr.js"></script>

    <!-- client code -->
    <script src="index.js"></script>
  </head>

  <body>
    <canvas id="camerafeed"></canvas>
  
  <!-- Required attribution for the 8th Wall engine -->
  <script src="../../../shared/attribution.js"></script>
</body>
</html>
