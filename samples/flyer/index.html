<!doctype html>
<html>

<head>
  <script>window.__XR_ENGINE_LICENSE = 'mit'</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>8th Wall Web: Flyer</title>

  <script src="../../lib/vendor/web/aframe/8frame-1.3.0.min.js"></script>

  <!-- XR Extras - provides utilities like load screen, almost there, and error handling.
         See github.com/8thwall/web/tree/master/xrextras -->
  <script src="../../lib/vendor/web/xrextras/xrextras.js"></script>

  <!-- Landing Pages - see https://www.8thwall.com/docs/web/#landing-pages -->
  <script src="../../lib/vendor/qrcode-generator/qrcode.js"></script>
  <script src="../../shared/landing.js"></script>

  <!-- MIT engine (engine/mit/, self-built from github.com/8thwall/8thwall) -->
  <script async src="../../engine/mit/xr.js"></script>

</head>

<body>

  <a-scene
    xrextras-gesture-detector
    xrextras-loading
    xrextras-runtime-error
    renderer="colorManagement:true"
    xrweb="disableWorldTracking: true">

    <a-assets>
      <!-- Credit to Poly by Google for the model: https://poly.google.com/view/dA5osnS0Rzj -->
      <a-asset-item id="jelly-glb" src="jellyfish-model.glb"></a-asset-item>
      <img id="jelly-thumb" src="targets/video-target.jpg">
      <video
        id="jelly-video"
        autoplay
        muted
        crossorigin="anonymous"
        loop="true"
        src="jellyfish-video.mp4">
      </video>
    </a-assets>

    <a-camera
      position="0 4 10"
      raycaster="objects: .cantap"
      cursor="fuse: false; rayOrigin: mouse;">
    </a-camera>

    <a-light type="directional" intensity="0.5" position="1 1 1"></a-light>

    <a-light type="ambient" intensity="1"></a-light>

    <!-- Note: "name:" must be set to the name of the image target uploaded to the 8th Wall Console -->
    <xrextras-named-image-target name="video-target">
      <a-entity
        xrextras-play-video="video: #jelly-video; thumb: #jelly-thumb; canstop: true"
        geometry="primitive: plane; height: 1; width: 0.79;"
      ></a-entity>
    </xrextras-named-image-target>

    <!-- Note: "name:" must be set to the name of the image target uploaded to the 8th Wall Console -->
    <xrextras-named-image-target name="model-target">
      <!-- Add a child entity that can be rotated independently of the image target. -->
      <a-entity xrextras-one-finger-rotate gltf-model="#jelly-glb"></a-entity>
    </xrextras-named-image-target>

  </a-scene>


  <!-- Required attribution for the 8th Wall engine -->
  <script src="../../shared/attribution.js"></script>
</body>
</html>
