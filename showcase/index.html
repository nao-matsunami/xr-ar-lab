<!doctype html>
<html lang="ja">
<head>
  <script>window.__XR_ENGINE_LICENSE = 'mit'</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#000000">
  <title>antymark</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>

  <!-- three.js（lib/vendor/three/ — ローカル、MIT）。
       three.module.min.js は同ディレクトリの three.core.min.js を相対 import する
       ので、importmap の項目は "three" ひとつで足りる。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "../lib/vendor/three/three.module.min.js"
    }
  }
  </script>

  <!-- xrextras はローカルの同梱版。ここでは FullWindowCanvas だけ使う
       （キャンバスをビデオのアスペクトに合わせて画面いっぱいに保つ処理）。
       A-Frame 無しでも動く。ローディング UI は自前（点ひとつ）なので使わない。 -->
  <script src="../lib/vendor/web/xrextras/xrextras.js"></script>

  <!-- MIT エンジン (engine/mit/ — github.com/8thwall/8thwall を自前ビルド)。
       data-preload-chunks="slam" は MIT 版でも必須。チャンク名 slam は
       xr-tracking.js に解決され、それが XR8.XrController を生やす。 -->
  <script async src="../engine/mit/xr.js" data-preload-chunks="slam"></script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <script type="module" src="./ar/main.js"></script>

  <!-- 8th Wall エンジンの帰属表示（ⓘ）。MIT 版の文面が出る。 -->
  <script src="../shared/attribution.js"></script>
</body>
</html>
