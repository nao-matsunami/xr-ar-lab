<!doctype html>
<html lang="ja">
<head>
  <script>window.__XR_ENGINE_LICENSE = 'mit'</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:,">
  <meta name="theme-color" content="#000000">
  <!-- 営業用。直接 URL でのみ開く（一覧・公開リンクは置かない） -->
  <meta name="robots" content="noindex, nofollow">
  <title>墨</title>

  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
    #camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  </style>

  <!-- three.js（lib/vendor/three/ — ローカル、MIT）。
       three.module.min.js は同ディレクトリの three.core.min.js を相対 import する
       ので、three の項目は "three" ひとつで足りる。
       本体は shared/ar-core/（showcase と共通）。墨文字に固有の設定とターゲットは
       ar-config / ar-targets としてここで ./ar/ に解決させる。 -->
  <script type="importmap">
  {
    "imports": {
      "three": "../../lib/vendor/three/three.module.min.js",
      "ar-config": "./ar/config.js",
      "ar-targets": "./ar/targets.js"
    }
  }
  </script>

  <!-- xrextras はローカルの同梱版。ここでは FullWindowCanvas だけ使う
       （キャンバスをビデオのアスペクトに合わせて画面いっぱいに保つ処理）。
       A-Frame 無しでも動く。ローディング UI は自前（点ひとつ）なので使わない。 -->
  <script src="../../lib/vendor/web/xrextras/xrextras.js"></script>

  <!-- MIT エンジン (engine/mit/ — github.com/8thwall/8thwall を自前ビルド)。
       data-preload-chunks="slam" は MIT 版でも必須。チャンク名 slam は
       xr-tracking.js に解決され、それが XR8.XrController を生やす。 -->
  <script async src="../../engine/mit/xr.js" data-preload-chunks="slam"></script>
</head>

<body>
  <canvas id="camerafeed"></canvas>

  <script type="module" src="../../shared/ar-core/main.js"></script>

  <!-- 8th Wall エンジンの帰属表示（ⓘ）。MIT 版の文面が出る。 -->
  <script src="../../shared/attribution.js"></script>
</body>
</html>
